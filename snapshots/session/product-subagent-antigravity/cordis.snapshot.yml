# Replay the recorded parent while the native subprocess protocol stays real.
- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-antigravity
      name: '@deepseek-ai/dsh-subagent-antigravity'
      config:
        command: !!js "process.cwd() + '/agy-fixture.mjs'"
        model: fixture-selected-model
        timeoutMs: 30000

    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: subagent:antigravity
            model: fixture-selected-model

    - id: tool-subagent-antigravity
      name: '../../../packages/subagent/subagent-antigravity/tests/fixtures/loader/scoped-tool.ts'
